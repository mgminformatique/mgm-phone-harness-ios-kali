[package]
name = "mgm-ios-installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
async-trait = "0.1"
apple-codesign-quick = "=0.1.0"
cms = "=0.2.3"
der = "=0.7.10"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "afc", "installation_proxy"] }
isideload = { version = "=0.5.2", default-features = false, features = ["install", "tokio-mt", "keyring-storage"] }
plist = "1"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rootcause = "0.12"
rpassword = "7"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = "0.2"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
